name: Release on merged PR

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: random-picker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify version and existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -Raw -Encoding UTF8 'app.config.json' | ConvertFrom-Json
          $version = [string]$config.version
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "app.config.json must contain a numeric SemVer release version: $version"
          }
          $tag = "v$version"
          $commit = (git rev-parse HEAD).Trim()
          $existingTag = @(git tag --list $tag)
          if ($existingTag.Count -gt 0) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $commit) {
              throw "Refusing to reuse $tag: existing tag points to $tagCommit, merged commit is $commit. Bump app.config.json version before merging another release."
            }
          }
          gh release view $tag --json tagName --repo $env:GITHUB_REPOSITORY *> $null
          $alreadyReleased = $LASTEXITCODE -eq 0
          if ($alreadyReleased -and $existingTag.Count -eq 0) {
            throw "Release $tag exists without a local tag. Refusing to overwrite or silently skip."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "skip=$($alreadyReleased.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($alreadyReleased) { Write-Host "Release $tag already exists for $commit; nothing to publish." }

      - name: Run application regression tests
        if: steps.version.outputs.skip != 'true'
        run: node --test tests/*.test.cjs

      - name: Build and verify both single-HTML variants
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Stage release files
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          Copy-Item 'dist/index.html' 'release-assets/random-picker.html'
          Copy-Item 'dist/index.self-extract.html' 'release-assets/random-picker-self-extract.html'
          foreach ($file in @('release-assets/random-picker.html', 'release-assets/random-picker-self-extract.html')) {
            if ((Get-Item $file).Length -le 0) { throw "Release asset is empty: $file" }
          }

      - name: Publish version tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          # gh release create creates a missing Git tag at --target and then publishes
          # the Release. Existing tags may only be reused when they match this merge.
          gh release create $env:TAG `
            'release-assets/random-picker.html' `
            'release-assets/random-picker-self-extract.html' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:COMMIT `
            --title "Random Picker $env:TAG" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $env:TAG" }
          Write-Host "Published $env:TAG for merged commit $env:COMMIT."
